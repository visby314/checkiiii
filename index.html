*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:10px}
h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(1.6rem,7vw,2.1rem);line-height:1.15;text-wrap:balance}
.inboxcount{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
.inboxcount .lbl{font-size:.72rem;font-weight:700;color:var(--muted)}
.inboxcount .n{font-family:var(--f-display);font-size:2.4rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.inboxcount .u{font-size:.75rem;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--tint);border-radius:999px;padding:4px}
.segbtn{font:inherit;font-size:.9rem;font-weight:700;border:0;background:transparent;color:var(--muted);padding:7px 4px;border-radius:999px;cursor:pointer}
.segbtn[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.banner{margin:0;background:var(--warn-soft);color:var(--warn);font-size:.85rem;font-weight:700;padding:10px 14px;border-radius:10px}
.banner[hidden],.view[hidden]{display:none}
.card{background:var(--paper);border:1px solid var(--rule-soft);border-left:5px solid var(--accent);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.flabel{font-size:.85rem;font-weight:700}
.flabel em{font-style:normal;font-size:.7rem;color:#fff;background:var(--accent);border-radius:999px;padding:0 7px;margin-left:4px;vertical-align:1px}
.pick{display:block;text-align:center;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px dashed var(--accent);border-radius:10px;padding:12px;cursor:pointer}
.pick.sub{color:var(--muted);background:var(--tint);border-color:var(--rule)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs:empty{display:none}
.th{position:relative}
.th img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--rule-soft);display:block}
.rm{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:14px;line-height:24px;padding:0;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.85rem;font-weight:700;border:1px solid var(--rule-soft);background:var(--paper);color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-checked="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=text],input[type=password],textarea{font:inherit;font-size:16px;width:100%;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:9px 11px}
textarea{resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,.pick:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.primary{font:inherit;font-weight:700;font-size:1rem;color:#fff;background:var(--accent);border:0;border-radius:999px;padding:12px;cursor:pointer}
.primary:active{opacity:.85}
.tool{font:inherit;font-size:.85rem;font-weight:700;color:var(--accent);background:var(--paper);border:1px solid var(--accent);border-radius:999px;padding:6px 12px;cursor:pointer}
.msg{margin:0;font-size:.85rem;font-weight:700;color:var(--accent);min-height:1.4em}
.note{margin:0;font-size:.85rem;color:var(--muted)}
.note b{color:var(--ink)}
.listhead{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
ol.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--rule-soft);border-radius:10px;padding:8px 10px}
.item img{width:56px;height:56px;object-fit:cover;border-radius:6px}
.item .meta{min-width:0}
.item .t{font-weight:700;font-size:.9rem;overflow-wrap:anywhere}
.item .s{font-size:.75rem;color:var(--muted);overflow-wrap:anywhere}
.item .m{font-size:.78rem;border-top:1px dashed var(--rule-soft);margin-top:4px;padding-top:4px;overflow-wrap:anywhere}
.pill{font-size:.7rem;font-weight:700;border-radius:999px;padding:1px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.wait{background:var(--warn-soft);color:var(--warn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <h1>間違えた問題 受け箱</h1>
    <div class="inboxcount" id="inboxCount" aria-live="polite"><span class="lbl">受け箱で処理待ち</span><span class="n" id="inboxN">–</span><span class="u">件</span></div>
  </header>

  <nav class="seg" role="tablist" aria-label="画面">
    <button type="button" class="segbtn" role="tab" data-view="add" aria-selected="true">登録</button>
    <button type="button" class="segbtn" role="tab" data-view="list" aria-selected="false">送った問題</button>
    <button type="button" class="segbtn" role="tab" data-view="settings" aria-selected="false">設定</button>
  </nav>

  <p class="banner" id="setupBanner" hidden>まだ送り先が設定されていません。「設定」でリポジトリと鍵を入れてください。登録した問題はこの端末に保存され、設定が済むと送られます。</p>

  <!-- 登録 -->
  <section class="view" id="view-add">
    <form id="addForm" class="card" novalidate>
      <div class="field">
        <span class="flabel">問題の写真 <em>必須</em></span>
        <label class="pick" for="ph-problem">写真を撮る・選ぶ</label>
        <input id="ph-problem" type="file" accept="image/*" multiple data-kind="problem" hidden>
        <div class="thumbs" id="th-problem"></div>
      </div>
      <div class="field">
        <span class="flabel">自分の解答の写真</span>
        <label class="pick sub" for="ph-mine">写真を撮る・選ぶ</label>
        <input id="ph-mine" type="file" accept="image/*" multiple data-kind="mine" hidden>
        <div class="thumbs" id="th-mine"></div>
      </div>
      <div class="field">
        <span class="flabel">模範解答の写真</span>
        <label class="pick sub" for="ph-answer">写真を撮る・選ぶ</label>
        <input id="ph-answer" type="file" accept="image/*" multiple data-kind="answer" hidden>
        <div class="thumbs" id="th-answer"></div>
      </div>

      <div class="field">
        <span class="flabel">科目</span>
        <div class="chips" id="subjects" role="radiogroup" aria-label="科目"></div>
      </div>
      <div class="field">
        <label class="flabel" for="source">出典</label>
        <input id="source" type="text" list="sourceList" placeholder="例：河野塾 数A 演習1-3" autocomplete="off">
        <datalist id="sourceList"></datalist>
      </div>
      <div class="field">
        <span class="flabel">間違えた原因（いくつでも）</span>
        <div class="chips" id="reasons" aria-label="間違えた原因"></div>
      </div>
      <div class="field">
        <label class="flabel" for="memo">メモ</label>
        <textarea id="memo" rows="3" placeholder="例：nが偶数のときの場合分けを忘れた"></textarea>
      </div>
      <button type="submit" class="primary" id="submitBtn">受け箱に送る</button>
      <p class="msg" id="addMsg" role="status"></p>
    </form>
  </section>

  <!-- 送った問題 -->
  <section class="view" id="view-list" hidden>
    <div class="listhead">
      <p class="note" id="queueNote"></p>
      <button type="button" class="tool" id="retryBtn" hidden>まだ送れていない分を送る</button>
    </div>
    <ol class="items" id="items"></ol>
  </section>

  <!-- 設定 -->
  <section class="view" id="view-settings" hidden>
    <form id="setForm" class="card" novalidate>
      <p class="note">送り先は、GitHubの<b>非公開</b>リポジトリです。鍵（トークン）はこの端末の中だけに保存されます。</p>
      <div class="field"><label class="flabel" for="owner">ユーザー名</label><input id="owner" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="visby314"></div>
      <div class="field"><label class="flabel" for="repo">リポジトリ名</label><input id="repo" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="study-inbox"></div>
      <div class="field"><label class="flabel" for="token">鍵（Fine-grained token）</label><input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…"></div>
      <div class="row2">
        <button type="submit" class="primary">保存してつながるか確かめる</button>
      </div>
      <p class="msg" id="setMsg" role="status"></p>
    </form>
  </section>
</div>

<script>
(function(){
  'use strict';
  const SUBJECTS = ['数学','物理','化学','英語','国語','その他'];
  const REASONS = ['方針が立たない','計算ミス','条件の見落とし','論証の不備','知識不足','問題の読み違い','時間切れ'];
  const SOURCES = ['河野塾 数A','河野塾 数B','河野塾 数C','河野塾 数Ⅲ','ハイレベル物理','ハイレベル物理演習','ハイレベル化学','ハイレベル化学演習','化学の新演習','有機構造決定問題集','ハイレベル数学の完全攻略','東大過去問','共通テスト'];
  const KINDS = ['problem','mine','answer'];
  const LS = 'study-inbox-settings-v1';
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ---------- 設定 ----------
  let cfg = {owner:'', repo:'', token:''};
  try { Object.assign(cfg, JSON.parse(localStorage.getItem(LS) || '{}')); } catch(e) {}
  const ready = () => !!(cfg.owner && cfg.repo && cfg.token);

  // ---------- IndexedDB（送る前の問題をためておく） ----------
  let dbp = null;
  function idb(){
    if (!dbp) dbp = new Promise((res, rej) => {
      const r = indexedDB.open('study-inbox', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('items', {keyPath:'id'});
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function tx(mode, fn){
    const d = await idb();
    return new Promise((res, rej) => {
      const t = d.transaction('items', mode); const st = t.objectStore('items');
      const out = fn(st); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error);
    });
  }
  const putItem = it => tx('readwrite', s => s.put(it));
  const allItems = () => tx('readonly', s => s.getAll());

  // ---------- 写真を縮める ----------
  async function shrink(file){
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const max = 1600, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*sc); c.height = Math.round(img.naturalHeight*sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
      const t = document.createElement('canvas'); const ts = 160 / Math.max(c.width, c.height); t.width = Math.round(c.width*ts); t.height = Math.round(c.height*ts);
      t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
      return {blob, thumb: t.toDataURL('image/jpeg', 0.7)};
    } finally { URL.revokeObjectURL(url); }
  }

  // ---------- 登録フォーム ----------
  const picked = {problem:[], mine:[], answer:[]};
  let subject = '数学'; const reasons = new Set();
  $('subjects').innerHTML = SUBJECTS.map(s => `<button type="button" class="chip" role="radio" aria-checked="${s===subject}" data-s="${s}">${s}</button>`).join('');
  $('reasons').innerHTML = REASONS.map(s => `<button type="button" class="chip" aria-pressed="false" data-r="${s}">${s}</button>`).join('');
  $('sourceList').innerHTML = SOURCES.map(s => `<option value="${esc(s)}"></option>`).join('');
  $('subjects').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (!b) return; subject = b.dataset.s; $('subjects').querySelectorAll('.chip').forEach(x => x.setAttribute('aria-checked', String(x === b))); });
  $('reasons').addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (!b) return; const r = b.dataset.r; reasons.has(r) ? reasons.delete(r) : reasons.add(r); b.setAttribute('aria-pressed', String(reasons.has(r))); });

  function renderThumbs(kind){
    $('th-'+kind).innerHTML = picked[kind].map((p,i) => `<span class="th"><img src="${p.thumb}" alt=""><button type="button" class="rm" data-kind="${kind}" data-i="${i}" aria-label="この写真を外す">×</button></span>`).join('');
  }
  KINDS.forEach(k => {
    $('ph-'+k).addEventListener('change', async e => {
      const files = [...e.target.files]; e.target.value = '';
      setMsg('addMsg', '写真を読み込み中…');
      for (const f of files) { try { picked[k].push(await shrink(f)); } catch(err) { setMsg('addMsg', '読み込めない写真がありました。'); } }
      renderThumbs(k); setMsg('addMsg', '');
    });
  });
  document.querySelector('#addForm').addEventListener('click', e => {
    const b = e.target.closest('.rm'); if (!b) return;
    picked[b.dataset.kind].splice(+b.dataset.i, 1); renderThumbs(b.dataset.kind);
  });
  function setMsg(id, t){ $(id).textContent = t; }

  $('addForm').addEventListener('submit', async e => {
    e.preventDefault();
    if (!picked.problem.length) { setMsg('addMsg', '問題の写真を1枚以上入れてください。'); return; }
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    const id = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}-${Math.random().toString(36).slice(2,6)}`;
    const item = {
      id, createdAt: now.toISOString(), subject, source: $('source').value.trim(), reasons: [...reasons], memo: $('memo').value.trim(),
      photos: Object.fromEntries(KINDS.map(k => [k, picked[k].map(p => p.blob)])),
      thumb: picked.problem[0].thumb, status: 'pending', sentFiles: []
    };
    await putItem(item);
    KINDS.forEach(k => { picked[k] = []; renderThumbs(k); });
    reasons.clear(); $('reasons').querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed','false'));
    $('memo').value = ''; $('source').value = '';
    setMsg('addMsg', ready() ? '保存しました。送っています…' : '保存しました。設定が済むと送ります。');
    await renderList();
    if (ready()) { const ok = await sendAll(); setMsg('addMsg', ok ? '受け箱に送りました。' : 'この端末に保存しました。電波が戻ったら「送った問題」から送れます。'); }
  });

  // ---------- GitHub ----------
  const api = (path, opt={}) => fetch(`https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}${path}`, Object.assign({
    headers: Object.assign({'Authorization': 'Bearer ' + cfg.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}, opt.headers || {})
  }, opt));
  const b64blob = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
  const b64text = t => btoa(unescape(encodeURIComponent(t)));
  async function putFile(path, content, message){
    const r = await api(`/contents/${path}`, {method:'PUT', body: JSON.stringify({message, content})});
    if (r.ok) return true;
    if (r.status === 422) return true; // 前回の途中で同じファイルが送られている
    throw new Error('HTTP ' + r.status);
  }

  let sending = false;
  async function sendAll(){
    if (!ready() || sending) return false;
    sending = true; let allOk = true;
    try {
      const items = (await allItems()).filter(i => i.status !== 'sent').sort((a,b) => a.id < b.id ? -1 : 1);
      for (const it of items) {
        try {
          const files = {};
          for (const k of KINDS) {
            files[k] = [];
            for (let i = 0; i < (it.photos[k]||[]).length; i++) {
              const name = `${k}-${i+1}.jpg`; files[k].push(name);
              const path = `inbox/${it.id}/${name}`;
              if (!it.sentFiles.includes(path)) {
                await putFile(path, await b64blob(it.photos[k][i]), `add ${it.id} ${name}`);
                it.sentFiles.push(path); await putItem(it);
              }
            }
          }
          const meta = {app:'study-inbox', v:1, id:it.id, createdAt:it.createdAt, subject:it.subject, source:it.source, reasons:it.reasons, memo:it.memo, files};
          await putFile(`inbox/${it.id}/meta.json`, b64text(JSON.stringify(meta, null, 2)), `add ${it.id} meta`);
          it.status = 'sent'; it.sentAt = new Date().toISOString(); it.photos = {}; it.error = '';
          await putItem(it);
        } catch(err) {
          allOk = false; it.error = String(err.message || err); await putItem(it);
          if (/HTTP 40[13]/.test(it.error)) break;
        }
      }
    } finally { sending = false; await renderList(); refreshCount(); }
    return allOk;
  }

  async function refreshCount(){
    if (!ready()) { $('inboxN').textContent = '–'; return; }
    try {
      const r = await api('/contents/inbox');
      if (r.status === 404) { $('inboxN').textContent = '0'; return; }
      if (!r.ok) throw 0;
      const arr = await r.json(); $('inboxN').textContent = String(arr.filter(x => x.type === 'dir').length);
    } catch(e) { /* 電波がないときはそのまま */ }
  }

  // ---------- 送った問題 ----------
  async function renderList(){
    const items = (await allItems()).sort((a,b) => a.id < b.id ? 1 : -1);
    const pending = items.filter(i => i.status !== 'sent');
    $('retryBtn').hidden = !pending.length || !ready();
    $('queueNote').textContent = pending.length ? `まだ送れていない問題が${pending.length}件あります。` : (items.length ? 'すべて受け箱に送ってあります。' : 'まだ登録した問題はありません。「登録」から写真を入れてください。');
    $('items').innerHTML = items.slice(0, 60).map(it => {
      const d = new Date(it.createdAt);
      const when = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      const st = it.status === 'sent' ? '<span class="pill ok">送信済み</span>' : `<span class="pill wait">${it.error ? '送れていません' : '送信待ち'}</span>`;
      return `<li class="item"><img src="${it.thumb}" alt=""><div class="meta"><div class="t">${esc(it.source || '出典なし')}</div>` +
        `<div class="s">${esc(it.subject)}・${when}${it.reasons.length ? '・' + esc(it.reasons.join('、')) : ''}</div>${it.memo ? `<div class="m">${esc(it.memo)}</div>` : ''}</div>${st}</li>`;
    }).join('');
    $('setupBanner').hidden = ready();
  }
  $('retryBtn').addEventListener('click', async () => { $('queueNote').textContent = '送っています…'; await sendAll(); });

  // ---------- 設定画面 ----------
  $('owner').value = cfg.owner; $('repo').value = cfg.repo; $('token').value = cfg.token;
  $('setForm').addEventListener('submit', async e => {
    e.preventDefault();
    cfg = {owner: $('owner').value.trim(), repo: $('repo').value.trim(), token: $('token').value.trim()};
    try { localStorage.setItem(LS, JSON.stringify(cfg)); } catch(err) {}
    if (!ready()) { setMsg('setMsg', '3つとも入れてください。'); return; }
    setMsg('setMsg', '確かめています…');
    try {
      const r = await api('');
      if (r.status === 401) { setMsg('setMsg', '鍵が正しくないか、期限が切れています。'); return; }
      if (r.status === 404) { setMsg('setMsg', 'リポジトリが見つかりません。名前と、鍵にこのリポジトリの許可を付けたかを確認してください。'); return; }
      if (!r.ok) { setMsg('setMsg', 'GitHubにつながりませんでした（' + r.status + '）。'); return; }
      const repo = await r.json();
      if (!repo.private) { setMsg('setMsg', 'このリポジトリは公開になっています。問題集の写真を入れるので、非公開に変えてから使ってください。'); return; }
      setMsg('setMsg', 'つながりました。登録した問題はこのリポジトリの inbox フォルダに入ります。');
      await renderList(); sendAll();
    } catch(err) { setMsg('setMsg', 'GitHubにつながりませんでした。電波を確認してください。'); }
  });

  // ---------- 画面切り替え ----------
  document.querySelector('.seg').addEventListener('click', e => {
    const b = e.target.closest('[data-view]'); if (!b) return;
    document.querySelectorAll('.segbtn').forEach(x => x.setAttribute('aria-selected', String(x === b)));
    document.querySelectorAll('.view').forEach(v => v.hidden = v.id !== 'view-' + b.dataset.view);
    if (b.dataset.view === 'list') renderList();
  });

  window.addEventListener('online', () => sendAll());
  renderList().then(() => { refreshCount(); sendAll(); });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
