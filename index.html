  --f-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  --f-num:"Anton","Impact","Arial Narrow Bold",sans-serif;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,9vw,3rem);line-height:1.05;margin:0;letter-spacing:.01em}
h1 em{font-style:normal;color:var(--accent)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;border-bottom:6px solid var(--rule);padding-bottom:12px}
.sync{font-size:.8rem;color:var(--muted)}
.sync b{font-weight:800;color:var(--ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;font-weight:700}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px;background:var(--k)}

/* 全体 */
.overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ov{background:var(--paper);border:2px solid var(--rule);padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ovtop{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.ov h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.5rem;line-height:1}
.remain{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
.remain .rl{font-size:.7rem;font-weight:800;color:var(--muted);writing-mode:horizontal-tb}
.remain .rn{font-family:var(--f-num);font-size:2.6rem;line-height:.9;font-variant-numeric:tabular-nums;color:var(--accent)}
.remain .rn.zero{color:var(--ink)}
.remain .ru{font-size:.75rem;font-weight:800}
.ov .sub{font-size:.72rem;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:grid;grid-template-columns:2.4em 1fr auto;align-items:center;gap:8px;font-size:.72rem;font-weight:800}
.bar .track{height:8px;background:var(--rule-soft);overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--k);transition:width .3s}
.bar .val{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:.85rem;font-weight:400;min-width:4.8em;text-align:right;letter-spacing:.02em}
@media (max-width:620px){.overview{grid-template-columns:1fr}}

/* タブ */
.tabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tabs .grp{font-size:.7rem;font-weight:800;color:var(--muted);letter-spacing:.12em;margin:0 2px 0 8px}
.tab{font-family:var(--f-display);font-weight:400;font-size:.95rem;border:2px solid var(--rule);background:var(--paper);color:var(--ink);padding:6px 12px;cursor:pointer;line-height:1.2}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab:focus-visible,.chip:focus-visible,.tool:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.toolbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.toolbar label{font-size:.82rem;font-weight:800;display:flex;gap:6px;align-items:center}
select,.tool{font:inherit;font-size:.82rem;font-weight:700;color:var(--ink);background:var(--paper);border:2px solid var(--rule);border-radius:0;padding:4px 10px;cursor:pointer}
.tools{display:flex;gap:6px;flex-wrap:wrap}

.coursehead{display:flex;flex-direction:column;gap:8px;border-top:6px solid var(--rule);padding-top:12px}
.chrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.coursehead h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(1.4rem,6vw,2rem);line-height:1.15;min-width:0;overflow-wrap:anywhere}
.coursehead .remain .rn{font-size:3.6rem}
.coursehead .sub{color:var(--muted);font-size:.8rem;font-weight:700}
.coursehead .bars{max-width:460px}

.chapter{display:flex;flex-direction:column;gap:8px}
.chapter h3{margin:14px 0 0;font-family:var(--f-display);font-weight:400;font-size:1.05rem;display:flex;align-items:center;gap:10px}
.chapter h3::after{content:"";flex:1;height:2px;background:var(--rule)}
details.sec{background:var(--paper);border:2px solid var(--rule)}
details.sec[hidden]{display:none}
details.sec.complete{border-color:var(--rule-soft)}
summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
summary::-webkit-details-marker{display:none}
.sname{font-weight:800;min-width:0;overflow-wrap:anywhere}
.sname::before{content:"▶";display:inline-block;width:1.2em;font-size:.75em;transition:transform .15s}
details[open] .sname::before{transform:rotate(90deg)}
.sname .range{font-family:var(--f-num);font-weight:400;font-size:.85rem;color:var(--muted);margin-left:8px;letter-spacing:.03em}
.sname .done{font-size:.7rem;font-weight:800;color:var(--on);background:var(--accent);margin-left:8px;padding:1px 7px}
.mini{display:flex;gap:10px;font-size:.72rem;font-weight:800;color:var(--muted)}
.mini i{font-style:normal;font-family:var(--f-num);font-weight:400;font-size:.95rem;color:var(--k)}
.mini b{font-family:var(--f-num);font-weight:400;font-size:.85rem}
.stripe{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.stripe span{height:5px;background:var(--rule-soft);position:relative;overflow:hidden}
.stripe span::after{content:"";position:absolute;inset:0;width:var(--p);background:var(--k)}

.bulk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px 10px;border-top:2px solid var(--rule);font-size:.75rem;font-weight:800}
.bulk .tool{font-size:.75rem;padding:2px 8px}

ol.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--rule-soft)}
.row[hidden]{display:none}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1rem;letter-spacing:.03em;min-width:2.2em;color:var(--muted)}
.label{min-width:0;overflow-wrap:anywhere;font-size:.9rem;font-weight:600}
.row.all .label,.row.all .num{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.chips{display:flex;gap:4px}
.chip{font:inherit;font-size:.75rem;font-weight:800;line-height:1;padding:7px 9px;border:2px solid var(--rule-soft);background:transparent;color:var(--muted);cursor:pointer;min-width:3.4em;border-radius:0}
.chip[aria-pressed="true"]{background:var(--k);border-color:var(--k);color:var(--on)}
.chip:hover{border-color:var(--k);color:var(--ink)}
.chip[aria-pressed="true"]:hover{color:var(--on)}
@media (max-width:520px){
  .row{grid-template-columns:auto 1fr}
  .chips{grid-column:1/-1;justify-content:flex-end}
  .chip{padding:8px 11px}
}
.k1{--k:var(--c1)} .k2{--k:var(--c2)} .k3{--k:var(--c3)}
.empty{font-weight:800;padding:12px 0}
.note{font-size:.75rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

html{-webkit-text-size-adjust:100%}
body{padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px);margin:0;-webkit-tap-highlight-color:transparent}
.sheet{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px)}
.sheet[hidden]{display:none}

<script>
(function(){
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const COURSES = [...DATA.science, ...DATA.kono];
  const BY_ID = Object.fromEntries(COURSES.map(c => [c.id, c]));
  const STAGES = [{bit:1,name:'視聴',k:'k1'},{bit:2,name:'演習',k:'k2'},{bit:4,name:'復習',k:'k3'}];
  const GROUPS = [
    {name:'化学', sub:'マナビス ハイレベル化学・演習', ids:['kagaku']},
    {name:'物理', sub:'マナビス ハイレベル物理・演習', ids:['butsuri']},
    {name:'河野塾', sub:'徹底基礎講座 数A・数B・数C・数Ⅲ', ids:['sugA','sugB','sugC','sug3']},
  ];
  const LS_KEY = 'kouza-checklist-v1';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ---- state（この端末の中だけに保存）----
  let state = {};
  let ui = {tab:'kagaku', filter:0, open:{}};
  try { const raw = localStorage.getItem(LS_KEY); if (raw) { const v = JSON.parse(raw); state = v.state || {}; ui = Object.assign(ui, v.ui || {}); } } catch(e) {}
  function normalize(){ COURSES.forEach(c => { if (!state[c.id] || typeof state[c.id] !== 'object') state[c.id] = {}; }); }
  normalize();
  if (!BY_ID[ui.tab]) ui.tab = 'kagaku';
  let saveFailed = false;
  function saveLocal(){
    try { localStorage.setItem(LS_KEY, JSON.stringify({state, ui})); saveFailed = false; }
    catch(e) { if (!saveFailed) { saveFailed = true; alertBar('保存できませんでした。プライベートブラウズでは記録が残りません。'); } }
  }
  function alertBar(t){ const n = document.querySelector('.note'); if (n) n.textContent = t; }
  // 記録が勝手に消されにくくする（対応している端末だけ）
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}

  const sectionsOf = c => c.chapters.flatMap(ch => ch.sections);
  const itemNums = c => sectionsOf(c).flatMap(s => s.items.map((_, i) => s.start + i));
  function count(cid, nums){
    const st = state[cid]; const r = [0,0,0];
    for (const n of nums){ const b = st[n] || 0; if (b&1) r[0]++; if (b&2) r[1]++; if (b&4) r[2]++; }
    return r;
  }
  const pct = (a,b) => b ? Math.round(a*1000/b)/10 : 0;

  function barsHTML(r, total){
    return '<div class="bars">' + STAGES.map((s,i) =>
      `<div class="bar ${s.k}"><span>${s.name}</span><span class="track"><span class="fill" style="width:${pct(r[i],total)}%"></span></span><span class="val">${r[i]}/${total}</span></div>`).join('') + '</div>';
  }

  function remainHTML(left){
    return `<div class="remain"><span class="rl">未視聴</span><span class="rn${left?'':' zero'}">${left}</span><span class="ru">本</span></div>`;
  }
  function renderOverview(){
    document.getElementById('overview').innerHTML = GROUPS.map(g => {
      let r=[0,0,0], t=0;
      g.ids.forEach(id => { const nums = itemNums(BY_ID[id]); const c = count(id, nums); r = r.map((v,i)=>v+c[i]); t += nums.length; });
      return `<div class="ov"><div class="ovtop"><h2>${g.name}</h2>${remainHTML(t-r[0])}</div><div class="sub">${g.sub}（全${t}本）</div>${barsHTML(r,t)}</div>`;
    }).join('');
  }

  function renderTabs(){
    const t = document.getElementById('tabs');
    const btn = c => `<button class="tab" role="tab" type="button" data-tab="${c.id}" aria-selected="${c.id===ui.tab}">${esc(c.name)}</button>`;
    t.innerHTML = DATA.science.map(btn).join('') + '<span class="grp">河野塾</span>' + DATA.kono.map(btn).join('');
  }

  function secKey(cid, s){ return cid + ':' + s.start; }

  function renderCourse(){
    const c = BY_ID[ui.tab]; const st = state[c.id]; const f = ui.filter;
    const nums = itemNums(c); const total = count(c.id, nums);
    let html = `<div class="coursehead"><div class="chrow"><h2>${esc(c.full)}</h2>${remainHTML(nums.length-total[0])}</div><div class="sub">全${nums.length}本${c.num ? '・番号は動画の通し番号' : ''}</div>${barsHTML(total, nums.length)}</div>`;
    let shown = 0;
    for (const ch of c.chapters){
      let chHTML = '';
      for (const s of ch.sections){
        const sn = s.items.map((_,i)=>s.start+i);
        const r = count(c.id, sn); const n = sn.length;
        const rows = s.items.map((label,i) => {
          const num = s.start+i, b = st[num]||0;
          const hide = f && (b & f);
          return `<li class="row${b===7?' all':''}" data-n="${num}"${hide?' hidden':''}>` +
            `<span class="num">${c.num ? String(num).padStart(3,'0') : ''}</span>` +
            `<span class="label">${esc(label)}</span>` +
            `<span class="chips">${STAGES.map(x=>`<button type="button" class="chip ${x.k}" data-bit="${x.bit}" aria-pressed="${!!(b&x.bit)}" aria-label="${esc(label)} ${x.name}">${x.name}</button>`).join('')}</span></li>`;
        });
        const visible = f ? sn.filter(k => !((st[k]||0) & f)).length : n;
        if (visible) shown++;
        const key = secKey(c.id, s);
        const isOpen = ui.open[key] ?? !c.num;
        const range = c.num ? `${String(s.start).padStart(3,'0')}–${String(s.start+n-1).padStart(3,'0')}` : (s.sub||'');
        chHTML += `<details class="sec${r[0]===n&&r[1]===n&&r[2]===n?' complete':''}" data-key="${key}" data-start="${s.start}" data-len="${n}"${isOpen?' open':''}${visible?'':' hidden'}>` +
          `<summary><span class="sname">${esc(s.name)}<span class="range">${esc(range)}</span>${r[0]===n&&r[1]===n&&r[2]===n?'<span class="done">完了</span>':''}</span>` +
          `<span class="mini">${STAGES.map((x,i)=>`<span>${x.name[0]} <i class="${x.k}">${r[i]}</i>/<b>${n}</b></span>`).join('')}</span>` +
          `<span class="stripe">${STAGES.map((x,i)=>`<span class="${x.k}" style="--p:${pct(r[i],n)}%"></span>`).join('')}</span></summary>` +
          `<div class="bulk">まとめて：${STAGES.map(x=>`<button type="button" class="tool ${x.k}" data-bulk="${x.bit}">${x.name}</button>`).join('')}</div>` +
          `<ol class="rows">${rows.join('')}</ol></details>`;
      }
      html += `<div class="chapter">${ch.name?`<h3>${esc(ch.name)}</h3>`:''}${chHTML}</div>`;
    }
    if (!shown) html += '<p class="empty">この条件に当てはまる動画はありません。</p>';
    document.getElementById('course').innerHTML = html;
  }

  function renderAll(){ renderOverview(); renderTabs(); renderCourse(); document.getElementById('filter').value = String(ui.filter); }

  // ---- 操作 ----
  document.getElementById('tabs').addEventListener('click', e => {
    const b = e.target.closest('[data-tab]'); if (!b) return;
    ui.tab = b.dataset.tab; saveLocal(); renderTabs(); renderCourse();
  });
  document.getElementById('filter').addEventListener('change', e => { ui.filter = +e.target.value; saveLocal(); renderCourse(); });
  document.getElementById('openAll').addEventListener('click', () => setAllOpen(true));
  document.getElementById('closeAll').addEventListener('click', () => setAllOpen(false));
  function setAllOpen(v){
    document.querySelectorAll('details.sec').forEach(d => { d.open = v; ui.open[d.dataset.key] = v; });
    saveLocal();
  }
  document.getElementById('course').addEventListener('toggle', e => {
    const d = e.target; if (!d.matches || !d.matches('details.sec')) return;
    ui.open[d.dataset.key] = d.open; saveLocal();
  }, true);
  document.getElementById('course').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    const cid = ui.tab; const st = state[cid];
    if (chip){
      const n = +chip.closest('.row').dataset.n, bit = +chip.dataset.bit;
      st[n] = (st[n]||0) ^ bit; if (!st[n]) delete st[n];
      changed(); return;
    }
    const bulk = e.target.closest('[data-bulk]');
    if (bulk){
      const d = bulk.closest('details.sec'); const start = +d.dataset.start, len = +d.dataset.len, bit = +bulk.dataset.bulk;
      let all = true; for (let i=0;i<len;i++) if (!((st[start+i]||0)&bit)) { all = false; break; }
      for (let i=0;i<len;i++){ const k = start+i; st[k] = all ? ((st[k]||0) & ~bit) : ((st[k]||0) | bit); if (!st[k]) delete st[k]; }
      changed();
    }
  });
  function changed(){
    saveLocal();
    const y = window.scrollY; renderOverview(); renderCourse(); window.scrollTo(0, y);
  }

  // ---- 書き出し・読み込み ----
  const sheet = document.getElementById('sheet'), code = document.getElementById('code'), msg = document.getElementById('msg');
  let importArmed = false;
  function setMsg(t){ msg.textContent = t; }
  document.getElementById('backupBtn').addEventListener('click', () => { sheet.hidden = false; setMsg(''); importArmed = false; resetImport(); });
  document.getElementById('sheetClose').addEventListener('click', () => { sheet.hidden = true; });
  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.hidden = true; });
  document.getElementById('exportBtn').addEventListener('click', () => {
    code.value = btoa(unescape(encodeURIComponent(JSON.stringify({app:'kouza-checklist', v:1, at:new Date().toISOString(), state}))));
    setMsg('書き出しました。コピーして、メモアプリなどに保存しておくと安心です。');
  });
  document.getElementById('copyBtn').addEventListener('click', async () => {
    if (!code.value) { setMsg('先に「いまの記録を書き出す」を押してください。'); return; }
    try { await navigator.clipboard.writeText(code.value); setMsg('コピーしました。'); }
    catch(e) { code.focus(); code.select(); setMsg('自動でコピーできなかったので、コードを選択しました。長押しでコピーしてください。'); }
  });
  function resetImport(){ document.getElementById('importBtn').textContent = '貼り付けたコードを読み込む'; }
  document.getElementById('importBtn').addEventListener('click', () => {
    let parsed;
    try { parsed = JSON.parse(decodeURIComponent(escape(atob(code.value.trim())))); } catch(e) { parsed = null; }
    if (!parsed || parsed.app !== 'kouza-checklist' || typeof parsed.state !== 'object') {
      importArmed = false; resetImport();
      setMsg('このコードは読み込めませんでした。書き出したコードを最後まで貼り付けたか確認してください。'); return;
    }
    if (!importArmed) {
      importArmed = true;
      document.getElementById('importBtn').textContent = 'もう一度押すと、いまの記録を上書きします';
      setMsg((parsed.at ? new Date(parsed.at).toLocaleString('ja-JP') + ' に書き出した記録です。' : '') + 'いまの端末の記録は消えて、この内容に置き換わります。');
      return;
    }
    state = parsed.state; normalize(); saveLocal(); renderAll();
    importArmed = false; resetImport(); setMsg('読み込みました。');
  });

  renderAll();

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
